[package]
name = "protocol"
version = "0.1.0"
edition = "2021"
description = "finick-specific IPC protocol types (settings, notifications, clipboard, modals)"
license = "MIT"

[dependencies]
ipc = { path = "../ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tokio = { version = "1", features = ["full"] }
