name: Rust

on:
  push:
    branches: ["main", "master"]
    tags:
      - v[0-9]+.*
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      with:
        submodules: recursive
      # rustfmt.toml uses unstable options (imports_granularity, etc.),
      # so formatting requires nightly. devenv.nix / flake.nix both pin nightly.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      with:
        submodules: recursive
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libgtk-4-dev \
            libadwaita-1-dev \
            libglib2.0-dev \
            libasound2-dev \
            libdbus-1-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libvulkan-dev \
            libsqlite3-dev \
            libpam0g-dev \
            libgtk-3-dev \
            libpango1.0-dev \
            libcairo2-dev \
            libgdk-pixbuf-2.0-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libxdo-dev
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      with:
        submodules: recursive
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libgtk-4-dev \
            libadwaita-1-dev \
            libglib2.0-dev \
            libasound2-dev \
            libdbus-1-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libvulkan-dev \
            libsqlite3-dev \
            libpam0g-dev \
            libgtk-3-dev \
            libpango1.0-dev \
            libcairo2-dev \
            libgdk-pixbuf-2.0-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libxdo-dev
      - run: cargo check --workspace --locked
      - run: cargo test --workspace --locked

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, clippy, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      with:
        submodules: recursive
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libgtk-4-dev \
            libadwaita-1-dev \
            libglib2.0-dev \
            libasound2-dev \
            libdbus-1-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libvulkan-dev \
            libsqlite3-dev \
            libpam0g-dev \
            libgtk-3-dev \
            libpango1.0-dev \
            libcairo2-dev \
            libgdk-pixbuf-2.0-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libxdo-dev
      - name: Build release
        run: cargo build --release --locked
      - name: Stage binaries
        run: |
          mkdir -p dist
          for bin in overlay topbar launcher settings files locker store finickd index polkit-agent finickctl; do
            if [ -f "target/release/$bin" ]; then
              cp "target/release/$bin" "dist/$bin"
            else
              echo "::warning::binary not found: $bin"
            fi
          done
          ls -la dist
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: finick-${{ github.ref_name }}-x86_64-unknown-linux-gnu
          path: dist/
          if-no-files-found: error
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
