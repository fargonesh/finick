[package]
name = "locker"
version = "0.1.0"
edition = "2024"

[dependencies]
freya = { git = "https://github.com/marc2332/freya", branch = "main", features = ["all"] }
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ipc = { path = "../../libs/ipc", package = "ipc" }
config = { path = "../../libs/config" }
system = { path = "../../libs/system" }
ui = { path = "../../libs/ui" }
chrono = "0.4"
winit = "0.30"
