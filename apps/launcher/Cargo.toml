[package]
name = "launcher"
version = "0.1.0"
edition = "2024"

[dependencies]
config = { path = "../../libs/config" }
ipsea = { path = "../../libs/ipc", package = "ipc" }
index = { path = "../../services/index" }
ui = { path = "../../libs/ui" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
freya = { git = "https://github.com/marc2332/freya", branch = "main", features = ["all"] }

[[bin]]
name = "launcher"
path = "src/main.rs"
