[package]
name = "store"
version = "0.1.0"
edition = "2024"

[dependencies]
config = { path = "../../libs/config" }
ipsea = { path = "../../libs/protocol", package = "protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
ui = { version = "0.1.0", path = "../../libs/ui" }
system = { path = "../../libs/system" }

freya = { workspace = true }
freya-performance-plugin = { workspace = true }
freya-devtools = { workspace = true }

[[bin]]
name = "store"
path = "src/main.rs"
