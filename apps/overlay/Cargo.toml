[package]
name = "overlay"
version = "0.1.0"
edition = "2024"
default-run = "overlay"

[dependencies]
config = { path = "../../libs/config" }
ipsea = { path = "../../libs/ipc", package = "ipc" }
ui = { version = "0.1.0", path = "../../libs/ui" }
system = { path = "../../libs/system" }
index = { path = "../../services/index" }
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

freya = { git = "https://github.com/marc2332/freya", branch = "main", features = [
    "all",
] }
tokio = { version = "1.43", features = ["full"] }
winit = "0.30"

[lib]
name = "overlay"
path = "src/lib.rs"

[[bin]]
name = "overlay"
path = "src/bin/overlay.rs"

[[bin]]
name = "topbar"
path = "src/bin/topbar.rs"

[[bin]]
name = "launcher"
path = "src/bin/launcher.rs"
