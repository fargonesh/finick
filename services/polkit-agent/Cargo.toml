[package]
name = "polkit-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ipc = { path = "../../libs/ipc", package = "ipc" }
zbus = { version = "5", features = ["tokio"] }
pretty_env_logger = "0.5.0"
log = "0.4"
